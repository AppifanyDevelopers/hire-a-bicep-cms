<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hire A Bicep - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body,
    html {
      height: 100%;
      font-family: "Inter", sans-serif;
      background-color: #0d2c49;
      color: #eff1f3;
    }

    .container {
      display: flex;
      height: 100vh;
      width: 100%;
    }

    form {
      width: 100%;
    }

    .left-pane {
      flex: none;
      width: 507px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      color: #eff1f3;
      margin-left: 170px;
    }

    .logo {
      display: flex;
      justify-content: center;
      margin-bottom: 60px;
    }

    .logo img {
      width: auto;
      height: auto;
      max-height: 178px;
      max-width: 340px;
      display: block;
    }

    .login-box {
      width: 100%;
    }

    .login-box h2 {
      margin-bottom: 24px;
      font-size: 26px;
      font-weight: 600;
    }

    .login-box input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 18px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
    }

    .forgot-password {
      text-align: right;
      margin-bottom: 40px;
    }

    .forgot-password a {
      color: #eff1f3;
      font-size: 14px;
      text-decoration: none;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: none;
      color: #eff1f3;
      border: 1px solid #eff1f3;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s;
    }

    .login-btn:hover {
      background-color: #f9c22e;
      color: #0d2c49;
    }

    .right-pane {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: right;
    }

    .right-pane img {
      width: 100%;
      max-width: 450px;
      height: auto;
    }

    @media (max-width: 600px) {
      .logo img {
        max-height: 70px;
      }

      .login-box h2 {
        font-size: 22px;
      }

      .login-box input,
      .login-btn {
        font-size: 14px;
        padding: 12px 14px;
      }
    }

    @media (max-width: 767px) {
      .container {
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .left-pane {
        width: 100%;
        margin-left: 0;
        padding: 40px 24px;
        align-items: center;
        margin-top: 215px;
      }

      .logo {
        justify-content: center;
      }

      .logo img {
        max-width: 220px !important;
      }

      .login-box {
        width: 100%;
        max-width: 360px;
      }

      .right-pane {
        justify-content: center;
        padding: 20px;
        margin-top: 20px;
      }

      .right-pane img {
        max-width: 280px;
        width: 100%;
        height: auto;
      }
    }

    .input-error {
      border: 2px solid red !important;
    }

    .error-text {
      color: red;
      font-size: 13px;
      margin-top: -10px;
      margin-bottom: 14px;
      display: block;
    }

    /* resend styles */
    #resendBtn {
      color: #f2c521;
      cursor: pointer;
      font-weight: 500;
    }

    #resendBtn.disabled {
      pointer-events: none;
      opacity: 0.5;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="left-pane">
      <div class="logo">
        <img src="img/login-logo.png" alt="Hire A Bicep Logo" />
      </div>
      <div class="login-box">
        <a href="login.html"
          style="margin-bottom: 22px; display: flex; align-items: center; gap: 8px; cursor: pointer; text-decoration: none; color: #eff1f3;">
          <img src="img/svg/back-arrow.svg" alt="Back to login" style="height: 16px;" />
          <span style="font-size: 14px; font-weight: 400;">Back to sign in</span>
        </a>
        <div style=" margin-bottom: 24px;">
          <h2 style="margin-bottom: 12px;">Verify Code</h2>
          <span class="logo-text" style="font-size: 15px; font-weight: 400; ">A verification code has been
            sent to your registered email. Enter the code below.</span>
        </div>
        <form id="loginForm">
          <div class="input-group" style="margin-bottom: 40px;">
            <input type="number" id="code" placeholder="Enter Code" oninput="this.value = this.value.slice(0, 6)" />
            <span class="error-text" id="codeError"></span>

            <div>
              <span class="logo-text" style="font-size: 15px; font-weight: 400;">
                Didn’t get code?
                <span id="resendBtn" class="disabled">Resend</span>
                <span id="timer">00:30</span>
              </span>
            </div>
          </div>
          <button type="submit" class="login-btn">Send Reset Link</button>
        </form>
      </div>
    </div>
    <div class="right-pane">
      <img src="img/bicep-logo.png" alt="Bicep Arm Illustration" />
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const codeInput = document.getElementById('code');
      const codeError = document.getElementById('codeError');

      let isValid = true;

      // Reset error state
      codeInput.classList.remove('input-error');
      codeError.textContent = '';

      const codeValue = codeInput.value.trim();

      if (!codeValue) {
        codeError.textContent = 'Verification code is required.';
        codeInput.classList.add('input-error');
        isValid = false;
      } else if (!/^\d{4,6}$/.test(codeValue)) {
        codeError.textContent = 'Enter a valid verification code.';
        codeInput.classList.add('input-error');
        isValid = false;
      }

      if (isValid) {
        window.location.href = "new-password.html";
      }
    });

    // Clear error on focus
    document.getElementById('code').addEventListener('focus', function () {
      this.classList.remove('input-error');
      document.getElementById('codeError').textContent = '';
    });

    // OTP RESEND + TIMER
    const resendBtn = document.getElementById("resendBtn");
    const timerEl = document.getElementById("timer");
    let countdown;
    let timeLeft = 30;

    function startTimer() {
      clearInterval(countdown);
      timeLeft = 30;
      timerEl.textContent = formatTime(timeLeft);
      resendBtn.classList.add("disabled");

      countdown = setInterval(() => {
        timeLeft--;
        timerEl.textContent = formatTime(timeLeft);

        if (timeLeft <= 0) {
          clearInterval(countdown);
          resendBtn.classList.remove("disabled");
          timerEl.textContent = "00:00";
        }
      }, 1000);
    }

    function formatTime(seconds) {
      let m = String(Math.floor(seconds / 60)).padStart(2, "0");
      let s = String(seconds % 60).padStart(2, "0");
      return `${m}:${s}`;
    }

    resendBtn.addEventListener("click", () => {
      if (resendBtn.classList.contains("disabled")) return;
      console.log("OTP Resent!"); // 👉 replace with API call
      startTimer();
    });

    // Start countdown on page load
    startTimer();
  </script>
</body>
</html>
