<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hire A Bicep - Login</title> 
</head>
<style>
input[type="password"]::-ms-reveal,
input[type="password"]::-ms-clear {
  display: none;
}

input[type="password"]::-webkit-credentials-auto-fill-button,
input[type="password"]::-webkit-clear-button {
  display: none !important;
}

   * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body,
html {
  height: 100%;
  font-family: "Inter", sans-serif;
  background-color: #0d2c49;
  color: #eff1f3;
}

.container {
  display: flex;
  height: 100vh;
  width: 100%;
}

form {
  width: 100%;
}

.left-pane {
  flex: none;
  width: 507px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  color: #eff1f3;

  margin-left: 170px;
}

.logo {
  display: flex;
  justify-content: center;
  margin-bottom: 60px;
}

.logo img {
  width: auto;
  height: auto;
  max-height: 178px;
  max-width: 340px;
  display: block;
}

.login-box {
  width: 100%;
}

.login-box h2 {
  margin-bottom: 24px;
  font-size: 26px;
  font-weight: 600;
}

.login-box input {
  width: 100%;
  padding: 14px 16px;
  margin-bottom: 18px;
  border: none;
  border-radius: 12px;
  font-size: 15px;
}

.password-wrapper {
  position: relative;
}

.password-wrapper input {
  padding-right: 45px;
}

.password-wrapper .toggle-password {
  position: absolute;
  right: 12px;
  top: 40%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  font-size: 16px;
}

.forgot-password {
  text-align: right;
  margin-bottom: 40px;
}

.forgot-password a {
  color: #eff1f3;
  font-size: 14px;
  text-decoration: none;
}

.login-btn {
  width: 100%;
  padding: 14px;
  background: none;
  color: #eff1f3;
  border: 1px solid #eff1f3;
  border-radius: 12px;
  cursor: pointer;
  font-size: 16px;
  transition: background 0.3s;
}

.login-btn:hover {
  background-color: #f9c22e;
  color: #0d2c49;
}

.right-pane {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: right;
  /* padding: 20px; */
}

.right-pane img {
  width: 100%;
  max-width: 450px;
  height: auto;
}

@media (max-width: 600px) {
  .logo img {
    max-height: 70px;
  }

  .login-box h2 {
    font-size: 22px;
  }

  .login-box input,
  .login-btn {
    font-size: 14px;
    padding: 12px 14px;
  }

  .password-wrapper .toggle-password img {
    height: 18px;
  }

  .forgot-password a {
    font-size: 12px;
  }
}

@media (max-width: 767px) {
  .right-pane{
    display:none;
  }
  .container {
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .left-pane {
    width: 100%;
    margin-left: 0;
    padding: 40px 24px;
    align-items: center;
  
  }

  .logo {
    justify-content: center;
  }

  .logo img {
    width: auto;
    height: auto;
    max-height: 178px;
    max-width: 220px !important;
    display: block;
  }

  .login-box {
    width: 100%;
    max-width: 360px;
  }

  .right-pane {
    justify-content: center;
    padding: 20px;
    margin-top: 20px;
  }

  .right-pane img {
    max-width: 280px;
    width: 100%;
    height: auto;
  }
}

@media (max-width: 1024px) {
  .left-pane {
    margin-left: 30px;
    margin-right: 24px;
  }

  .right-pane img {
    max-width: 270px;
    /* width: 100%; */
    height: auto;
  }

  .logo img {
    width: auto;
    height: auto;
    max-height: 178px;
    max-width: 270px;
    display: block;
  }
}

@media (min-width: 767px) and (max-width: 965px) {
  .left-pane {
    width: 350px;
    margin-left: 100px;
  }
}

.input-error {
  border: 2px solid red !important;
}

.input-error::placeholder {
  color: red; /* placeholder turns red on error */
  opacity: 1; /* ensure it's visible in all browsers */
}

.error-text {
  color: red;
  font-size: 13px;
  margin-top: -10px;
  margin-bottom: 14px;
  display: block;
}

/* remove number spinner */
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

input[type="number"] {
  -moz-appearance: textfield; /* For Firefox */
}
</style>
<body>
    <div class="container">
        <div class="left-pane">
            <div class="logo">
                <img src="img/login-logo.png" alt="Hire A Bicep Logo" />

            </div>
            <div class="login-box">
                <h2>Log in</h2>
                <form id="loginForm">
                    <div class="input-group">
                        <input type="text" id="email" placeholder="Email" />
                        <span class="error-text" id="emailError"></span>
                    </div>

                    <div class="input-group">
                        <div class="password-wrapper">
                            <input type="password" id="password" placeholder="Password" />
                            <button type="button" class="toggle-password">
                                <img src="img/svg/eye-open.svg" alt="Toggle Password" style="height: 20px;" />
                            </button>
                        </div>
                        <span class="error-text" id="passwordError"></span>
                    </div>

                    <div class="forgot-password">
                        <a href="forgot-password.html" style="text-decoration: none; color: #eff1f3;">Forgot
                            Password?</a>
                    </div>
                    <button type="submit" class="login-btn">Log In</button>
                </form>

            </div>
        </div>
        <div class="right-pane">
            <img src="img/bicep-logo.png" alt="Bicep Arm Illustration" />
        </div>
    </div>
    <!-- <script src="script.js"></script> -->
    <script>
        const passwordField = document.getElementById('password');
        const toggleBtn = document.querySelector('.toggle-password');
        const toggleImg = toggleBtn.querySelector('img');

        // Toggle password visibility and icon
        toggleBtn.addEventListener('click', function () {
            const isPasswordVisible = passwordField.getAttribute('type') === 'text';
            passwordField.setAttribute('type', isPasswordVisible ? 'password' : 'text');
            toggleImg.src = isPasswordVisible
                ? 'img/svg/eye-open.svg'
                : 'img/svg/eye-close.svg';
            toggleImg.alt = isPasswordVisible ? 'Show Password' : 'Hide Password';
        });

        // Validation on form submit
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const email = document.getElementById('email');
            const password = document.getElementById('password');
            const emailError = document.getElementById('emailError');
            const passwordError = document.getElementById('passwordError');

            let isValid = true;

            // Reset error styles and messages
            email.classList.remove('input-error');
            password.classList.remove('input-error');
            emailError.textContent = '';
            passwordError.textContent = '';

            // Email validation
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email.value.trim()) {
                emailError.textContent = 'Email is required.';
                email.classList.add('input-error');
                isValid = false;
            } else if (!emailPattern.test(email.value)) {
                emailError.textContent = '* Invalid Email';
                email.classList.add('input-error');
                isValid = false;
            }

            // Password validation
            if (!password.value.trim()) {
                passwordError.textContent = 'Password is required.';
                password.classList.add('input-error');
                isValid = false;
            }

            if (isValid) {
                window.location.href = 'home.html';
            }
        });

        // Clear email error on focus
        document.getElementById('email').addEventListener('focus', function () {
            this.classList.remove('input-error');
            document.getElementById('emailError').textContent = '';
        });

        // Clear password error on focus
        passwordField.addEventListener('focus', function () {
            this.classList.remove('input-error');
            document.getElementById('passwordError').textContent = '';
        });
    </script>


</body>

</html>
